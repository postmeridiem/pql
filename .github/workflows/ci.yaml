name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: install tools
        # Pinned versions, installed from source through the Go module
        # proxy + sumdb. The curl|sh release installer broke on an
        # upstream tarball checksum mismatch; go install sidesteps
        # release-asset checksums entirely and keeps CI on the same
        # golangci-lint version the dev machines use.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/goreleaser/goreleaser/v2@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./ci/lint.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: ./ci/test.sh

  snapshot:
    name: snapshot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.16.0
      - run: goreleaser release --snapshot --clean
