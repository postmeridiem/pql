name: release

# Publishes a GitHub Release with cross-platform binaries (via goreleaser)
# when a release is finalised on main.
#
# The release signal is a *dated* CHANGELOG section for the current
# version — `## [X.Y.Z] - DATE` where X.Y.Z is project.yaml's version: —
# which is the deliberate "post-release commit" the git-commit skill
# documents (rename the working section to add the date). While that
# section is still undated (`## [X.Y.Z]`) the version is in progress and
# must NOT release. Keying off the current version (not "the topmost dated
# section") deliberately ignores the pre-existing backlog of older dated
# sections that were never tagged.
#
# No PAT needed: the tag we push uses the built-in GITHUB_TOKEN. There is
# no v*-tag trigger, so that push starts nothing — releases are gated on
# main only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the tag and publish GitHub Releases
  packages: write
  id-token: write   # for keyless cosign signing once enabled

jobs:
  # The gate. ci.yaml runs the same checks on every push, but `needs:` cannot
  # cross workflows, so a red lint there would not have stopped a publish here —
  # and this workflow is what tags and ships binaries. Running it inline is the
  # only way to guarantee nothing is released past a failing lint, which
  # includes govulncheck.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./ci/lint.sh

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history; tag lookup needs tags

      - name: Resolve release from dated CHANGELOG section
        id: tag
        run: |
          set -euo pipefail
          # Current version is the single source of truth in project.yaml.
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' project.yaml | head -1)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read 'version:' from project.yaml"; exit 1
          fi
          # Release only once its CHANGELOG section carries a date.
          if ! grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG section for ${version} is undated — in progress, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.release == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: goreleaser release
        if: steps.tag.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
