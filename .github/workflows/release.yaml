name: release

# Publishes a GitHub Release with cross-platform binaries (via goreleaser)
# when a release is finalised on main.
#
# The release signal is a *dated* CHANGELOG section for the current
# version — `## [X.Y.Z] - DATE` where X.Y.Z is project.yaml's version: —
# produced by the one release commit the git-commit skill documents:
# rename `## [Unreleased]` to the version plus today's date, set
# project.yaml to match, open a fresh `## [Unreleased]`.
#
# Between releases project.yaml holds the *last released* version, whose
# section is dated and whose tag already exists, so this no-ops on the tag
# check. Work in progress sits under `## [Unreleased]`, which names no
# version and therefore cannot match. Both guards fail closed: an absent
# or undated section releases nothing.
#
# Keying off the current version (not "the topmost dated section")
# deliberately ignores the pre-existing backlog of older dated sections
# that were never tagged.
#
# No PAT needed: the tag we push uses the built-in GITHUB_TOKEN. There is
# no v*-tag trigger, so that push starts nothing — releases are gated on
# main only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the tag and publish GitHub Releases
  packages: write
  id-token: write   # for keyless cosign signing once enabled

env:
  # One pin for both jobs in this workflow, because they are two halves of one
  # claim: the lint job runs `goreleaser check` to validate .goreleaser.yaml,
  # and the release job runs `goreleaser release` against that same config. If
  # they are different builds of goreleaser, the check does not cover the
  # publish. They were: the publish step used the action's `version: latest`
  # while every other goreleaser invocation in this repo pinned v2.16.0 (T-70).
  # ci.yaml pins the same two versions for its own jobs — bump them together.
  GORELEASER_VERSION: v2.16.0
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # The gate. ci.yaml runs the same checks on every push, but `needs:` cannot
  # cross workflows, so a red lint there would not have stopped a publish here —
  # and this workflow is what tags and ships binaries. Running it inline is the
  # only way to guarantee nothing is released past a failing lint, which
  # includes govulncheck.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: install tools
        # Both tools, pinned to the same versions ci.yaml uses: ci/lint.sh runs
        # golangci-lint, `goreleaser check` and govulncheck, so installing only
        # the first fails the job on a missing binary rather than on a real
        # finding.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install github.com/goreleaser/goreleaser/v2@${{ env.GORELEASER_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./ci/lint.sh

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history; tag lookup needs tags

      - name: Resolve release from dated CHANGELOG section
        id: tag
        run: |
          set -euo pipefail
          # Current version is the single source of truth in project.yaml.
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' project.yaml | head -1)"
          if [[ -z "$version" ]]; then
            echo "::error::could not read 'version:' from project.yaml"; exit 1
          fi
          # Release only once its CHANGELOG section carries a date.
          if ! grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "No dated '## [${version}] - DATE' section in CHANGELOG — either the work is still under [Unreleased], or project.yaml was bumped without dating the section. Nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.release == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: install goreleaser
        if: steps.tag.outputs.release == 'true'
        # Installed the same way the lint job above installs it, so the binary
        # that publishes is the one `goreleaser check` validated the config
        # against. This is also where syft and cosign install steps land when
        # the SBOM and signing blocks in .goreleaser.yaml are uncommented.
        run: |
          go install github.com/goreleaser/goreleaser/v2@${{ env.GORELEASER_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Shells out to ci/release.sh rather than using goreleaser-action, so the
      # release path holds the same property as lint and test: the script is
      # what runs, locally and in CI, and swapping CI provider does not rewrite
      # what a release does. (T-70)
      - name: goreleaser release
        if: steps.tag.outputs.release == 'true'
        run: ./ci/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
