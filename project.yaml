# pql — project manifest
#
# Single source of truth for project metadata. Read by:
#   - the Makefile (VERSION ldflag)
#   - the Claude Code skill (compatibility check)
#   - any future consumer that needs to know "what is this project, what
#     version of it is on disk right now"
#
# Convention: this file declares the version the codebase *claims to be*.
# Local `make build` stamps this clean version string into the binary
# (just the number — no git SHA or dirty suffix). Tagged releases
# (handled by goreleaser) use the git tag for the binary's reported
# version; project.yaml's `version` is bumped in the post-release commit.

name: pql
description: SQL-derived CLI for querying markdown vaults — backs a Claude Code skill.
version: 2.3.1
status: v2.3.0 — the release that made the gates and the docs tell the truth. Builds pin Go 1.26.6, clearing four reachable stdlib advisories, and the secrets gate — which had reported clean for months while running the bare defaults, because its ruleset lived in an untracked file that existed in no clone — now ships its rules and fails when it cannot load them (T-117). `decisions show` returns the record's markdown body and `decisions read` folds into it as an alias, ending a split where the obvious verb answered incompletely and was silent about it (T-122). `pql decisions close` records terminal dispositions (T-99, T-118), supersession written in the Status line is finally parsed (T-119), and `--grep` filters every read verb (T-113). Installed skills now say pql owns them, and `skill install`'s refusal names the files `--force` would discard (T-121). Releases publish through `ci/release.sh` at a pinned goreleaser, replacing an unpinned action sitting beneath a pinned `goreleaser check`, with `ci/workflows_test.go` asserting that wiring so a dead script or a missing caller fails `make test` (T-70). Two decisions: D-32 (choose the default that makes an omission safe) and D-33 (CI scripts are the definition; callers invoke, never restate). Preceded by v2.2.0 — the fixes the audit's own follow-up turned up. `SELECT name` had truncated any filename ending in `d`, `m` or a period since v1.0.0 (`album.md` → `albu`), and bool frontmatter projected as `1` where `meta` returned `true` (T-93, T-94). Two inputs whose empty result read as an answer now fail loudly: `related`/`context` exit `66` on an unindexed path, and `ticket list --decision none` exits `64` (D-29, D-31). Preceded by v2.1.0 — the release an outside-in audit shaped. The ranked verbs stop returning `signals[]` and `connections[]` by default and gain the `--fields`/`--oneline`/`--full` trio (T-74); `--fields` reaches `ticket show` and `decisions show` (T-67), which now batches comma-separated ids (T-76); `ticket board` gains `--open`/`--status` and per-column labels (T-77); `.pqlignore` is read by default (T-78). Eight silent defects fixed, three of them found by an agent using the documented surface with no repo knowledge — including `ticket show --with-children`, which had returned nothing since D-26. Three decisions came out of the audit: D-29 (names are validated, filters are not), D-30 (mutations return receipts, not projections), D-31 (no absence filters).

repository: https://github.com/postmeridiem/pql
license: MIT
module: github.com/postmeridiem/pql

# The version axes, all exposed via `pql version --build-info`. Each is
# declared here and in internal/version; internal/version/version_test.go
# parses this file and fails on drift, so the two cannot diverge.
# docs/versions.md explains what each axis governs and maps them to releases.
#
# The two migrated axes carry the release their format was introduced in, not a
# bare counter: an out-of-date artefact should tell you which pql changed it.
# The two counters are stored per row / per database and compared for equality,
# so they stay numbers — widening them would be a data migration for no gain.
#
# index.db schema. Bumped when the binary's expected SQLite schema changes;
# index.db is a pure cache, so a mismatch drops and rebuilds it.
schema_version: 1

# pql.db row canonicalisation — the rules behind each planning row's content
# hash, stored on every one of those rows. Bumped when a projection rule changes.
canonical_version: 2

# pql.db schema generation. Set to the release that introduced the current
# shape; a database records how far it has been migrated in schema_migrations.
planning_schema_version: "2.0.0"

# .pql/changelog/ file format, as the release that introduced it. Not
# regenerable (the changelog is the log of record), so an older format is
# migrated forward in place — `pql plan upgrade`, and automatically from the
# post-merge hook. See D-28.
changelog_format: "2.0.0"

# Toolchain. Mirror in go.mod when bumping.
go_version: ">=1.25"

