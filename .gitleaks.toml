title = "pql — PII and path rules the gitleaks defaults do not cover"

# This file is COMMITTED, deliberately. Every rule below describes a SHAPE and
# never a value, so publishing it reveals nothing it guards.
#
# That is the whole reason it can exist here. The rules that must name what they
# guard — this environment's hostnames, and the private sibling repos in the
# same tree — cannot be committed to a public repo without publishing exactly
# the strings they exist to keep out, and a curated list is worse than an
# incidental mention: it is an authoritative, deduplicated inventory rather than
# one host in one sentence. Those live in an optional, gitignored
# .gitleaks.local.toml that extends this file, per machine; ci/secrets.sh uses
# it when present and says which layers ran either way.
#
# The split matters because the previous design put ALL of it in one untracked
# file, which meant a fresh clone had none of it. This repo ran that way for
# months: `make secrets` passed every time while checking only the gitleaks
# defaults, which are a secrets scanner (API keys, tokens, private keys) and
# not a PII scanner. A Visa number, an Amex number, an IBAN, a BSN and a US SSN
# were all verified to pass a default scan untouched (2026-08-09).
#
# THREE THINGS WILL BREAK THIS FILE SILENTLY IF YOU EDIT IT. All three were hit
# while writing it, and two produce a rule that matches nothing while looking
# correct. ci/secrets-selftest.sh exists to catch them; run it after any change.
#
#   1. gitleaks compiles with RE2, which has no lookahead. `(?!...)` panics on
#      load. Loud, at least — exclusions go in an allowlist instead.
#   2. regexTarget = "match" is MANDATORY on every rule-level allowlist. The
#      default target is the wider finding context, so an allowlist without it
#      suppresses every finding for that rule as soon as one exempt string
#      appears anywhere nearby.
#   3. useDefault = true inherits the default stopword list, which is applied
#      to the SECRET and contains ordinary words like "home". A rule whose
#      secret contains one is matched and then silently discarded — verified
#      against an identical control rule on a different path prefix, which
#      fired. Where that bites, wrap the distinguishing part in a CAPTURE
#      GROUP: gitleaks uses group 1 as the secret when one is present, which
#      moves the secret off the fixed prefix. The capture group is what does
#      the work; the accompanying secretGroup line is an assertion that it
#      exists, and gitleaks refuses to load the config if it does not.
[extend]
useDefault = true

# --- Environment shapes ----------------------------------------------------

[[rules]]
id = "pql-absolute-home-path"
description = "Absolute home-directory path — write ~/ instead"
# The capture group is load-bearing, per note 3 above. Without it the secret is
# the whole path, which contains "home", which is a default stopword, and every
# finding is dropped in silence — the rule looks correct and matches nothing.
# secretGroup does not change that behaviour; it asserts the group is there, so
# deleting the parentheses makes gitleaks refuse to load instead of quietly
# reverting to a dead rule.
regex = '''(?:/var)?/home/([a-z][a-z0-9_-]{2,})/'''
secretGroup = 1
tags = ["environment", "path"]
[rules.allowlist]
description = "Toolchain and CI-runner homes are not personal"
regexTarget = "match"
regexes = ['''/home/(?:linuxbrew|runner)/''']

[[rules]]
id = "pql-sibling-checkout-path"
description = "Absolute path into a sibling checkout — name the role, not the tree"
# Matches the path shape without naming any repo, which is what keeps this rule
# committable while the repo-name rule is not.
regex = '''/(?:var/)?mnt/[a-z0-9_-]+/projects/([a-z][a-z0-9._-]*)'''
secretGroup = 1
tags = ["environment", "path"]

[[rules]]
id = "pql-private-ip"
description = "RFC1918 address — describe the role instead"
regex = '''\b(?:192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["environment", "ip"]
[rules.allowlist]
description = "Canonical documentation examples"
regexTarget = "match"
regexes = ['''192\.168\.(?:0|1)\.(?:0|1|255)\b''']

# --- Personal data ---------------------------------------------------------

[[rules]]
id = "pql-iban"
description = "IBAN"
regex = '''\b(?:NL|BE|DE|FR|GB|ES|IT|PT|IE|LU|AT|CH|DK|SE|NO|FI|PL)\d{2}(?:[ ]?[A-Z0-9]{4}){2,7}[ ]?[A-Z0-9]{1,4}\b'''
tags = ["pii", "financial"]

[[rules]]
id = "pql-credit-card"
description = "Payment card number (Visa, Mastercard, Amex)"
regex = '''\b(?:4\d{3}(?:[ -]?\d{4}){3}|5[1-5]\d{2}(?:[ -]?\d{4}){3}|3[47]\d{2}[ -]?\d{6}[ -]?\d{5})\b'''
tags = ["pii", "financial"]

[[rules]]
id = "pql-us-ssn"
description = "US Social Security Number"
# [0-8] excludes the unassigned 9xx area range inline; the remaining reserved
# forms need an allowlist because RE2 cannot express them as lookahead.
regex = '''\b[0-8]\d{2}-\d{2}-\d{4}\b'''
tags = ["pii"]
[rules.allowlist]
description = "Reserved groups that are never issued"
regexTarget = "match"
regexes = ['''^(?:000|666)-''', '''-00-''', '''-0000$''']

[[rules]]
id = "pql-nl-bsn"
description = "Dutch BSN — keyword-scoped, because a bare 9-digit run is far too noisy"
regex = '''(?i)\b(?:bsn|burgerservicenummer|sofinummer)\b\D{0,24}\d{9}\b'''
keywords = ["bsn", "burgerservicenummer", "sofinummer"]
tags = ["pii"]

[[rules]]
id = "pql-personal-email"
description = "Personal email address in committed content"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''
tags = ["pii"]
[rules.allowlist]
description = "Attribution trailers and documentation placeholders are deliberate"
regexTarget = "match"
regexes = [
  '''@(?:example|test|invalid)\.''',
  '''noreply@''',
  '''@users\.noreply\.github\.com''',
]
# project.yaml and LICENSE carry the maintainer's name and address on purpose —
# authorship metadata, not a leak. Exempted by PATH rather than by value: a path
# is committable, and listing the address here would put it in the public repo
# to keep it out of the public repo.
paths = [
  '''(^|/)project\.yaml$''',
  '''(^|/)LICENSE$''',
]

# --- Global ----------------------------------------------------------------

[allowlist]
description = "Paths whose matches are structural rather than leaked"
paths = [
  # Vendored checksums: long base64/hex runs that trip entropy-based default
  # rules without ever carrying a secret.
  '''go\.sum$''',
  '''(^|/)testdata/.*\.(golden|json)$''',
  # The selftest fixture is wall-to-wall planted samples by construction.
  # ci/secrets-selftest.sh copies it elsewhere before scanning, so this
  # exemption does not blind the test that proves these rules still work.
  '''(^|/)ci/testdata/gitleaks-fixture\.txt$''',
]
